[config]
schemaVersion = "0.0.1"

[package]
namespace = "JevMods"
name = "JevControllerKeyboard"
versionNumber = "1.0.1"
description = "DEPRECATED: renamed to JevOnScreenKeyboard. Install that one instead, this package will not be updated."
websiteUrl = "https://github.com/JevMods/JevControllerKeyboard"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./package/icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/JevControllerKeyboard/bin/Release/JevControllerKeyboard.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "client-side" ]
