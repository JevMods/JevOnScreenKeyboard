[config]
schemaVersion = "0.0.1"

[package]
namespace = "JevMods"
name = "JevOnScreenKeyboard"
versionNumber = "1.1.0"
description = "On-screen keyboard for gamepad players. Pops up in text fields, hides when you go back to mouse. Xbox, PlayStation and Switch button glyphs. Native layouts for the game's languages, incl. Japanese, Korean and Chinese."
websiteUrl = "https://github.com/JevMods/JevOnScreenKeyboard"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2351"

[build]
icon = "./package/icon.png"
readme = "./README.md"
outdir = "./dist"

[[build.copy]]
source = "./src/JevOnScreenKeyboard/bin/Release/JevOnScreenKeyboard.dll"
target = "/"

[[build.copy]]
source = "./package/CHANGELOG.md"
target = "/"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "mods", "tweaks", "client-side" ]
