name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BEPINEX_VERSION: 5.4.2351
  PROJECT: src/JevOnScreenKeyboard/JevOnScreenKeyboard.csproj

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check versions
        run: |
          $csproj = [xml](Get-Content $env:PROJECT)
          $version = @($csproj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          $toml = (Select-String -Path thunderstore.toml -Pattern '^versionNumber = "(.+)"').Matches[0].Groups[1].Value
          if ($toml -ne $version) { throw "thunderstore.toml has $toml, the csproj has $version" }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version"
          }

      - name: Install SteamCMD
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip "$env:RUNNER_TEMP/steamcmd"
          & "$env:RUNNER_TEMP/steamcmd/steamcmd.exe" +quit
          $global:LASTEXITCODE = 0

      - name: Download the Valheim dedicated server
        run: |
          $steam = "$env:RUNNER_TEMP\steamcmd\steamcmd.exe"
          $server = "$env:RUNNER_TEMP\valheim"
          $dll = "$server\valheim_server_Data\Managed\assembly_valheim.dll"
          foreach ($attempt in 1..3) {
            & $steam +force_install_dir $server +login anonymous +app_update 896660 validate +quit
            if (Test-Path $dll) { exit 0 }
          }
          throw 'SteamCMD did not download the Valheim server'

      - name: Download BepInEx
        run: |
          Invoke-WebRequest "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$env:BEPINEX_VERSION/" -OutFile bepinex.zip
          Expand-Archive bepinex.zip "$env:RUNNER_TEMP/bepinex"

      - name: Build
        run: >
          dotnet build $env:PROJECT -c Release
          "-p:ManagedDir=$env:RUNNER_TEMP/valheim/valheim_server_Data/Managed"
          "-p:BepInExDir=$env:RUNNER_TEMP/bepinex/BepInExPack_Valheim/BepInEx"

      - name: Install the Thunderstore CLI
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Package
        run: tcli build

      - uses: actions/upload-artifact@v6
        with:
          name: package
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: package
          path: dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $notes = (Get-Content package/CHANGELOG.md -Raw) -split '(?m)^## ' |
            Where-Object { $_ -match "^$([regex]::Escape($version))\s" } |
            ForEach-Object { ($_ -split '\r?\n', 2)[1].Trim() }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*.zip).FullName --title $env:GITHUB_REF_NAME --notes "$notes"

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: package
          path: dist

      - name: Install the Thunderstore CLI
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Publish to Thunderstore
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          if (-not $env:TCLI_AUTH_TOKEN) { throw 'The THUNDERSTORE_TOKEN secret is not set for this repository.' }
          tcli publish --file (Get-ChildItem dist/*.zip).FullName
